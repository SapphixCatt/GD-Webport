<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="ref/logo.png">
<title>Geometry Dash WASM</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  width: 100vw;
  height: 100vh;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  background: #000;
  image-rendering: pixelated;
  outline: none;
  display: block;
  user-select: none;
  touch-action: none;
}
#loading-overlay {
  position: absolute;
  color: #fff;
  font-family: monospace;
  font-size: 18px;
  background: rgba(0, 0, 0, 0.85);
  padding: 20px;
  border-radius: 8px;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}
</style>
</head>

<body>
<div id="loading-overlay">Fetching LFS Assets...</div>
<canvas id="canvas" width="1920" height="1080" tabindex="0"></canvas>

<!-- Network Interceptor -->
<script>
(function() {
    const WORKER_URL = "https://gd-proxy.fly.dev";

    function extractPath(inputUrl) {
        if (!inputUrl) return null;
        let str = String(inputUrl);
        try { str = decodeURIComponent(str); } catch(e) {}

        // Handle direct Newgrounds MP3 audio streams and CDN links
        if (str.includes('newgrounds.com') || str.includes('ungrounded.net') || str.includes('audio.ngfiles.com') || str.endsWith('.mp3')) {
            return `?songUrl=${encodeURIComponent(str)}`;
        }

        // Account operations, progress syncing, comments, and profile fetching
        if (
            str.includes('/accounts/') || 
            str.includes('login') || 
            str.includes('register') || 
            str.includes('getGJAcc') || 
            str.includes('getGJUserInfo') || 
            str.includes('getGJAccountComments') || 
            str.includes('syncGJAccount') || 
            str.includes('saveGJAccount') || 
            str.includes('backup')
        ) {
            const match = str.match(/([a-zA-Z0-9_-]+\.php)/i);
            return match ? `accounts/${match[1]}` : null;
        }

        const match = str.match(/([a-zA-Z0-9_-]+\.php)/i);
        return match ? match[1] : null;
    }

    async function fetchWithWorker(path, init) {
        const proxyTarget = `${WORKER_URL}/${path}`;
        
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000);

            const modifiedInit = Object.assign({}, init || {}, {
                signal: controller.signal
            });

            const res = await originalFetch(proxyTarget, modifiedInit);
            clearTimeout(timeoutId);

            if (res.ok) {
                return res;
            }
        } catch (e) {
            console.warn("Proxy fetch failed:", e);
        }

        return new Response("-1", { status: 200, headers: { 'Content-Type': 'text/html' } });
    }

    const originalFetch = window.fetch;
    window.fetch = async function(resource, init) {
        let urlStr = typeof resource === 'string' ? resource : (resource ? resource.url : '');
        const path = extractPath(urlStr);

        if (path) {
            return fetchWithWorker(path, init);
        }

        return originalFetch.apply(this, arguments);
    };

    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
        const path = extractPath(url);
        if (path) {
            this.__gdEndpoint = path;
            this.__gdMethod = method;
        }
        return originalOpen.call(this, method, url, async, user, password);
    };

    const originalSend = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.send = function(body) {
        if (this.__gdEndpoint) {
            const xhr = this;
            fetchWithWorker(this.__gdEndpoint, { 
                method: this.__gdMethod || 'POST', 
                body: body,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            }).then(async (res) => {
                const text = await res.text();
                Object.defineProperty(xhr, 'responseText', { value: text, configurable: true });
                Object.defineProperty(xhr, 'response', { value: text, configurable: true });
                Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
                Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
                if (xhr.onreadystatechange) xhr.onreadystatechange();
                if (xhr.onload) xhr.onload();
            });
            return;
        }
        return originalSend.call(this, body);
    };
})();
</script>

<script>
var isSyncing = false;

function syncFilesToDB(filePath, data) {
  if (window.requestIdleCallback) {
    requestIdleCallback(function() { doSave(filePath, data); });
  } else {
    setTimeout(function() { doSave(filePath, data); }, 0);
  }
}

function doSave(filePath, data) {
  try {
    var req = indexedDB.open('gdwasm_saves', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
    req.onsuccess = function () {
      try {
        var db = req.result;
        var tx = db.transaction('files', 'readwrite');
        var store = tx.objectStore('files');
        var buf = (data && data.buffer && data.byteLength !== undefined) ? data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength) : data;
        if (buf) store.put(buf, filePath);
      } catch (e) {}
    };
  } catch (e) {}
}

function isPlayerInLevel() {
  if (typeof Module === 'undefined') return false;
  try {
    if (Module._gd_is_in_play_layer && Module._gd_is_in_play_layer()) {
      return true;
    }
    if (Module.gdIsInPlayLayer === true) {
      return true;
    }
  } catch(e) {}
  return false;
}

function saveFS() {
  if (!window.__gdRuntimeReady || typeof Module === 'undefined' || isSyncing) return;
  
  if (isPlayerInLevel()) {
    return;
  }

  isSyncing = true;
  try {
    if (Module._gd_request_save) Module._gd_request_save();
    if (Module.FS) {
      ['CCGameManager.dat', 'CCLocalLevels.dat', 'AppData/CCGameManager.dat', 'AppData/CCLocalLevels.dat'].forEach(function(file) {
        try {
          var p = file.indexOf('AppData/') === 0 ? '/' + file : '/Resources/' + file;
          var data = Module.FS.readFile(p);
          if (data && data.length) syncFilesToDB(file, data);
        } catch(e) {}
      });
      if (Module.FS.syncfs) {
        Module.FS.syncfs(false, function (err) {
          isSyncing = false;
        });
      } else {
        isSyncing = false;
      }
    } else {
      isSyncing = false;
    }
  } catch (e) {
    isSyncing = false;
  }
}

setInterval(saveFS, 30000);
document.addEventListener('visibilitychange', function () { if (document.hidden) saveFS(); });
window.addEventListener('beforeunload', saveFS);

function restoreSaves(then) {
  var called = false;
  function finish() { if (!called) { called = true; then(); } }
  setTimeout(finish, 3000);
  try {
    var req = indexedDB.open('gdwasm_saves', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
    req.onerror = finish;
    req.onsuccess = function () {
      var store, keysReq;
      try {
        store = req.result.transaction('files', 'readonly').objectStore('files');
        keysReq = store.getAllKeys();
      } catch (e) { finish(); return; }
      keysReq.onerror = finish;
      keysReq.onsuccess = function () {
        var keys = keysReq.result || [];
        if (!keys.length) { finish(); return; }
        var pending = keys.length;
        function one() { if (--pending === 0) finish(); }
        keys.forEach(function (k) {
          var g = store.get(k);
          g.onerror = one;
          g.onsuccess = function () {
            try {
              if (g.result && g.result.byteLength) {
                var s = String(k);
                var base = s.indexOf('AppData/') === 0 ? '/' : '/Resources/';
                var parts = s.split('/'), cur = base.replace(/\/$/, '');
                for (var pi = 0; pi < parts.length - 1; ++pi) {
                  cur += '/' + parts[pi];
                  try { Module.FS.stat(cur); } catch (e2) { Module.FS.mkdir(cur); }
                }
                Module.FS.writeFile(base + s, new Uint8Array(g.result));
              }
            } catch (e) {}
            one();
          };
        });
      };
    };
  } catch (e) { finish(); }
}

var gdDataBlobUrl = null;

async function fetchLfsDataFile() {
  const overlay = document.getElementById('loading-overlay');
  const lfsUrl = 'https://media.githubusercontent.com/media/SapphixCatt/GD-Webport/main/gd_web.data';
  
  if (overlay) overlay.innerText = 'Downloading 314 MB Game Data...';
  
  const resp = await fetch(lfsUrl);
  if (!resp.ok) {
    console.warn('LFS media endpoint fetch failed, trying local fallback.');
    return 'gd_web.data';
  }
  
  const blob = await resp.blob();
  gdDataBlobUrl = URL.createObjectURL(blob);
  return gdDataBlobUrl;
}

var Module = {
  canvas: (function() {
    var c = document.getElementById('canvas');
    return c;
  })(),
  gdInputQueue: [],
  gdCursorPos: [0, 0],
  webglContextAttributes: {
    alpha: false,
    depth: true,
    stencil: true,
    antialias: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: false,
    powerPreference: "high-performance"
  },
  locateFile: function (path, prefix) {
    if (path === 'gd_web.data' || path.endsWith('.data')) {
      return gdDataBlobUrl || 'gd_web.data';
    }
    return (prefix || '') + path;
  },
  print: function (text) {},
  printErr: function (text) {},
  setStatus: function (text) {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      if (!text) {
        overlay.style.display = 'none';
      } else {
        overlay.innerText = text;
      }
    }
  },
  onRuntimeInitialized: function () {
    window.__gdRuntimeReady = true;
    const overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.style.display = 'none';

    if (Module._gd_autosave_set) Module._gd_autosave_set(1);
    
    if (Module.FS && Module.FS.writeFile && !Module.FS.__hooked) {
      var origWrite = Module.FS.writeFile;
      Module.FS.writeFile = function (path, data, opts) {
        var res = origWrite.apply(this, arguments);
        if (path && (path.indexOf('CCLocalLevels') >= 0 || path.indexOf('CCGameManager') >= 0 || path.indexOf('.dat') >= 0)) {
          var cleanKey = path.replace(/^\/(Resources\/)?/, '');
          syncFilesToDB(cleanKey, data);
        }
        return res;
      };
      Module.FS.__hooked = true;
    }

    try { Module.FS.chdir('/Resources'); } catch (e) {}
    setTimeout(function () {
      restoreSaves(function () {
        try {
          const r = Module._gd_boot();
          if (r && typeof r.then === 'function') r.catch(function () {});
        } catch (e) {}
      });
    }, 50);
  }
};

async function gdStart() {
  window.__gdLoadStarted = true;
  window.__gdInputReady = true;
  var c = document.getElementById('canvas');
  if (c) c.focus();
  
  try {
    await fetchLfsDataFile();
  } catch (err) {
    console.error('Failed to load LFS data file:', err);
  }

  fetch('gd_web.js', { cache: 'no-store' }).then(function (r) {
    return r.text();
  }).then(function (code) {
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  });
}

window.addEventListener('DOMContentLoaded', gdStart);
</script>

<script>
(function () {
  const el = document.getElementById('canvas');
  const WM_MOUSEMOVE = 0x200, WM_LBUTTONDOWN = 0x201, WM_LBUTTONUP = 0x202,
        WM_RBUTTONDOWN = 0x204, WM_RBUTTONUP = 0x205,
        WM_MBUTTONDOWN = 0x207, WM_MBUTTONUP = 0x208;

  function ready() { return window.__gdInputReady === true; }

  function pos(e) {
    const r = el.getBoundingClientRect();
    const targetAspect = 1920 / 1080;
    const containerAspect = r.width / r.height;
    let renderWidth, renderHeight, offsetX, offsetY;

    if (containerAspect > targetAspect) {
      renderHeight = r.height;
      renderWidth = r.height * targetAspect;
      offsetX = r.left + (r.width - renderWidth) / 2;
      offsetY = r.top;
    } else {
      renderWidth = r.width;
      renderHeight = r.width / targetAspect;
      offsetX = r.left;
      offsetY = r.top + (r.height - renderHeight) / 2;
    }

    const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

    const x = Math.max(0, Math.min(1919, Math.round((clientX - offsetX) * 1920 / renderWidth)));
    const y = Math.max(0, Math.min(1079, Math.round((clientY - offsetY) * 1080 / renderHeight)));

    Module.gdCursorPos[0] = x;
    Module.gdCursorPos[1] = y;
    return (x & 0xffff) | ((y & 0xffff) << 16);
  }

  function push(m, w, l) {
    if (Module.gdInputQueue.length > 30) Module.gdInputQueue.shift();
    Module.gdInputQueue.push([m | 0, w | 0, l | 0]);
  }

  window.addEventListener('click', function() {
    if (el) el.focus();
  });

  window.addEventListener('mousedown', function (e) {
    if (!ready() || e.target !== el) return;
    el.focus();
    var m = e.button === 2 ? WM_RBUTTONDOWN : (e.button === 1 ? WM_MBUTTONDOWN : WM_LBUTTONDOWN);
    var w = e.button === 2 ? 2 : (e.button === 1 ? 16 : 1);
    push(m, w, pos(e));
    e.preventDefault();
  });

  window.addEventListener('mouseup', function (e) {
    if (!ready()) return;
    var m = e.button === 2 ? WM_RBUTTONUP : (e.button === 1 ? WM_MBUTTONUP : WM_LBUTTONUP);
    push(m, 0, pos(e));
    push(WM_MOUSEMOVE, 0, pos(e));
    if (e.target === el) e.preventDefault();
  });

  window.addEventListener('mousemove', function (e) {
    if (!ready()) return;
    var q = Module.gdInputQueue;
    var w = (e.buttons & 1) ? 1 : 0, l = pos(e);
    if (q.length && q[q.length - 1][0] === WM_MOUSEMOVE) q[q.length - 1] = [WM_MOUSEMOVE, w, l];
    else push(WM_MOUSEMOVE, w, l);
  });

  var VK = { 'Escape':0x1B,'Space':0x20,'Enter':0x0D,'Backspace':0x08,'Tab':0x09,
  'ArrowLeft':0x25,'ArrowUp':0x26,'ArrowRight':0x27,'ArrowDown':0x28,
  'KeyW':0x57,'KeyA':0x41,'KeyS':0x53,'KeyD':0x44,
  'KeyQ':0x51,'KeyE':0x12,'KeyR':0x13,'KeyF':0x21,'KeyP':0x19 };
  var SCAN = { 'Escape':0x01,'Space':0x39,'Enter':0x1C,'Backspace':0x0E,'Tab':0x0F,
  'ArrowLeft':0x4B,'ArrowUp':0x48,'ArrowRight':0x4D,'ArrowDown':0x50,
  'KeyW':0x11,'KeyA':0x1E,'KeyS':0x1F,'KeyD':0x20,
  'KeyQ':0x10,'KeyE':0x12,'KeyR':0x13,'KeyF':0x21,'KeyP':0x19 };
  var EXT = { 'ArrowLeft':1,'ArrowUp':1,'ArrowRight':1,'ArrowDown':1 };
  Module.gdKeyState = new Uint8Array(256);

  function keyEvent(e, down) {
    if (!ready()) return;
    var vk = VK[e.code] || e.keyCode || 0;
    if (down) {
      var ch = 0;
      if (e.key && e.key.length === 1) ch = e.key.charCodeAt(0);
      else if (e.code === 'Backspace') ch = 0x08;
      else if (e.code === 'Enter') ch = 0x0D;
      if (ch) {
        var clp = 1 | ((SCAN[e.code] || 0) << 16);
        if (EXT[e.code]) clp |= 0x1000000;
        push(0x0102, ch, clp);
      }
    }
    if (!vk) return;
    Module.gdKeyState[vk & 0xff] = down ? 1 : 0;
    var scan = SCAN[e.code] || 0;
    var lp = 1 | (scan << 16);
    if (EXT[e.code]) lp |= 0x1000000;
    if (!down) lp |= -1073741824;
    push(down ? 0x100 : 0x101, vk, lp);
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) {
      e.preventDefault();
    }
  }

  window.addEventListener('keydown', function (e) { keyEvent(e, true); });
  window.addEventListener('keyup', function (e) { keyEvent(e, false); });

  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>

<!-- Network Interceptor & URL Routing -->
<script>
(function() {
    const WORKER_URL = "https://gd-proxy.radekgaming67.workers.dev";
    const accountsEndpoints = [
        "loginGJAccount", "registerGJAccount", "backupGJAccountNew",
        "restoreGJAccountNew", "syncGJAccount20", "syncGJAccountNew",
        "saveGJAccount20", "saveGJAccount", "updateGJAcc", "updateGJUserScore22"
    ];

    function extractRequestType(inputUrl) {
        if (!inputUrl) return null;
        let str = String(inputUrl);
        try { str = decodeURIComponent(str); } catch(e) {}

        if (
            str.includes(':\\') || 
            str.startsWith('C:') || 
            str.startsWith('c:') || 
            str.startsWith('blob:') || 
            str.startsWith('data:')
        ) {
            return null;
        }

        let target = null;

        if (str.includes('__proxy?url=')) {
            const parts = str.split('__proxy?url=');
            if (parts[1]) target = decodeURIComponent(parts[1].split('&')[0]);
        } else if (str.startsWith('/__proxy?url=')) {
            const parts = str.split('/__proxy?url=');
            if (parts[1]) target = decodeURIComponent(parts[1].split('&')[0]);
        } else {
            target = str;
        }

        if (target && (target.includes('.php') || target.includes('database/') || target.includes('accounts/'))) {
            const matchPhp = target.match(/([a-zA-Z0-9_-]+\.php)/i);
            if (matchPhp) {
                const phpFile = matchPhp[1];
                let prefix = '';
                if (accountsEndpoints.some(e => phpFile.includes(e)) || target.includes('accounts/')) {
                    prefix = 'accounts/';
                }
                return { type: 'php', targetUrl: `${WORKER_URL}/?endpoint=${prefix}${phpFile}`, originalUrl: str };
            }
        }

        if (target && (target.includes('newgrounds.com') || target.includes('ngfiles.com') || target.includes('/audio/') || target.endsWith('.mp3') || target.endsWith('.ogg'))) {
            let songTarget = target;
            if (target.includes('songUrl=')) {
                songTarget = decodeURIComponent(target.split('songUrl=')[1].split('&')[0]);
            } else if (target.includes('?url=')) {
                songTarget = decodeURIComponent(target.split('?url=')[1].split('&')[0]);
            }
            return { type: 'song', targetUrl: songTarget, originalUrl: str };
        }

        if (target && (target.includes('geometrydashfiles.b-cdn.net') || target.includes('/news/'))) {
            return { type: 'news', targetUrl: target, originalUrl: str };
        }

        const matchPhp = str.match(/([a-zA-Z0-9_-]+\.php)/i);
        if (matchPhp) {
            const phpFile = matchPhp[1];
            let prefix = '';
            if (accountsEndpoints.some(e => phpFile.includes(e)) || str.includes('accounts/')) {
                prefix = 'accounts/';
            }
            return { type: 'php', targetUrl: `${WORKER_URL}/?endpoint=${prefix}${phpFile}`, originalUrl: str };
        }

        return null;
    }

    function cacheDownloadedSong(originalUrl, arrayBuf) {
        try {
            if (!Module.FS) return;
            let songId = null;
            const matchId = originalUrl.match(/(\d+)/g);
            if (matchId) {
                for (let m of matchId) {
                    if (m.length >= 4) { songId = m; break; }
                }
            }
            if (!songId) return;

            const filename = songId + '.mp3';
            const data = new Uint8Array(arrayBuf);

            ['/songs', '/Resources/songs', '/AppData/songs', '/'].forEach(dir => {
                try {
                    let cur = '';
                    dir.split('/').forEach(part => {
                        if (!part) return;
                        cur += '/' + part;
                        try { Module.FS.stat(cur); } catch(e) { Module.FS.mkdir(cur); }
                    });
                } catch(e) {}
            });

            [
                '/songs/' + filename,
                '/Resources/songs/' + filename,
                '/AppData/songs/' + filename,
                '/' + filename
            ].forEach(filePath => {
                try { Module.FS.writeFile(filePath, data); } catch(e) {}
            });

            if (typeof syncFilesToDB === 'function') {
                [
                    'songs/' + filename,
                    'Resources/songs/' + filename,
                    'AppData/songs/' + filename,
                    filename
                ].forEach(dbKey => {
                    syncFilesToDB(dbKey, data);
                });
            }
        } catch (e) {}
    }

    async function proxyFetch(targetUrl, init, reqType = 'php', originalUrl = '') {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);
            const modifiedInit = Object.assign({}, init || {}, { signal: controller.signal });
            
            let proxyEndpoint = targetUrl;
            if (reqType === 'song') {
                proxyEndpoint = `${WORKER_URL}/?songUrl=${encodeURIComponent(targetUrl)}`;
            } else if (reqType === 'news') {
                proxyEndpoint = `${WORKER_URL}/?newsUrl=${encodeURIComponent(targetUrl)}`;
            }

            const res = await originalFetch(proxyEndpoint, modifiedInit);
            clearTimeout(timeoutId);
            if (res.ok) {
                if (reqType === 'song') {
                    try {
                        const buf = await res.clone().arrayBuffer();
                        cacheDownloadedSong(originalUrl, buf);
                    } catch (e) {}
                }
                return res;
            }
        } catch (e) {}
        return new Response("-1", { status: 200, headers: { 'Content-Type': 'text/html' } });
    }

    const originalFetch = window.fetch;
    window.fetch = async function(resource, init) {
        let urlStr = typeof resource === 'string' ? resource : (resource ? resource.url : '');
        let reqInfo = extractRequestType(urlStr);
        if (reqInfo) {
            return proxyFetch(reqInfo.targetUrl, init, reqInfo.type, reqInfo.originalUrl);
        }
        return originalFetch.apply(this, arguments);
    };

    const originalOpen = XMLHttpRequest.prototype.open;
    const originalSend = XMLHttpRequest.prototype.send;
    const originalSetRequestHeader = XMLHttpRequest.prototype.setRequestHeader;

    XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
        this.__gdMethod = method;
        this.__gdUrl = url;
        this.__gdAsync = async;
        this.__gdUser = user;
        this.__gdPassword = password;
        this.__gdHeaders = {};
        
        const reqInfo = extractRequestType(url);
        if (reqInfo && reqInfo.type === 'song') {
            this.__isSongXhr = true;
            this.__originalSongUrl = reqInfo.targetUrl;
            try { this.responseType = 'arraybuffer'; } catch(e) {}
        }
        return;
    };

    XMLHttpRequest.prototype.setRequestHeader = function(header, value) {
        if (!this.__gdHeaders) this.__gdHeaders = {};
        this.__gdHeaders[header] = value;
    };

    XMLHttpRequest.prototype.send = async function(body) {
        const xhr = this;
        let urlStr = String(xhr.__gdUrl || '');
        const reqInfo = extractRequestType(urlStr);

        if (reqInfo) {
            if (reqInfo.type === 'song') {
                xhr.__gdProxyUrl = `${WORKER_URL}/?songUrl=${encodeURIComponent(reqInfo.targetUrl)}`;
                xhr.__isSongXhr = true;
                xhr.__originalSongUrl = reqInfo.targetUrl;
            } else if (reqInfo.type === 'news') {
                xhr.__gdProxyUrl = `${WORKER_URL}/?newsUrl=${encodeURIComponent(reqInfo.targetUrl)}`;
                xhr.__isNewsXhr = true;
            } else if (reqInfo.type === 'php') {
                xhr.__gdProxyUrl = reqInfo.targetUrl;
                xhr.__gdEndpoint = reqInfo.targetUrl.split('endpoint=')[1];
            }
        } else {
            xhr.__gdProxyUrl = xhr.__gdUrl;
        }

        originalOpen.call(xhr, xhr.__gdMethod, xhr.__gdProxyUrl, xhr.__gdAsync, xhr.__gdUser, xhr.__gdPassword);
        if (xhr.__gdHeaders) {
            for (let h in xhr.__gdHeaders) {
                try { originalSetRequestHeader.call(xhr, h, xhr.__gdHeaders[h]); } catch(e) {}
            }
        }

        if (xhr.__gdEndpoint) {
            proxyFetch(xhr.__gdProxyUrl, { 
                method: xhr.__gdMethod || 'POST', 
                body: body,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            }, 'php').then(async (res) => {
                const text = await res.text();
                setTimeout(() => {
                    try {
                        Object.defineProperty(xhr, 'responseText', { value: text, configurable: true });
                        Object.defineProperty(xhr, 'response', { value: text, configurable: true });
                        Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
                        Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
                        if (xhr.onreadystatechange) xhr.onreadystatechange();
                        if (xhr.onload) xhr.onload();
                    } catch (e) {}
                }, 10);
            });
            return;
        }

        if (xhr.__isSongXhr) {
            const origOnLoad = xhr.onload;
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        let buf = xhr.response;
                        if (buf instanceof ArrayBuffer) {
                            cacheDownloadedSong(xhr.__originalSongUrl, buf);
                        } else if (buf && buf.buffer instanceof ArrayBuffer) {
                            cacheDownloadedSong(xhr.__originalSongUrl, buf.buffer);
                        }
                    } catch (err) {}
                }
                if (origOnLoad) origOnLoad.apply(this, arguments);
            };
        }

        return originalSend.call(xhr, body);
    };
})();
</script>

<!-- Robust IndexedDB Persistence & Manual Save Handler -->
<script>
var isSyncing = false;
var isRestoring = false;

function syncFilesToDB(filePath, data) {
  if (isRestoring) return;
  try {
    var req = indexedDB.open('gdwasm_saves', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
    req.onsuccess = function () {
      try {
        var db = req.result;
        var tx = db.transaction('files', 'readwrite');
        var store = tx.objectStore('files');
        var buf = (data && data.buffer && data.byteLength !== undefined) ? data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength) : data;
        if (buf) store.put(buf, filePath);
      } catch (e) {}
    };
  } catch (e) {}
}

function saveFS() {
  if (!window.__gdRuntimeReady || typeof Module === 'undefined' || isSyncing || isRestoring) return;

  isSyncing = true;
  try {
    if (typeof Module._gd_request_save === 'function') {
      Module._gd_request_save();
    } else if (typeof Module._saveGame === 'function') {
      Module._saveGame();
    } else if (typeof Module.ccall === 'function') {
      try { Module.ccall('gd_request_save', null, [], []); } catch(e) {}
    }

    if (Module.FS) {
      ['CCGameManager.dat', 'CCLocalLevels.dat'].forEach(function(filename) {
        ['/Resources/' + filename, '/' + filename, '/AppData/' + filename].forEach(function(p) {
          try {
            var data = Module.FS.readFile(p);
            if (data && data.length) {
              syncFilesToDB(filename, data);
            }
          } catch(e) {}
        });
      });

      if (Module.FS.syncfs) {
        Module.FS.syncfs(false, function (err) { isSyncing = false; });
      } else {
        isSyncing = false;
      }
    } else {
      isSyncing = false;
    }
  } catch (e) {
    isSyncing = false;
  }
}

// Menu UI interaction & manual triggers
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('gd-menu-btn');
  const popup = document.getElementById('gd-menu-popup');
  
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
  });

  document.addEventListener('click', () => {
    popup.style.display = 'none';
  });

  popup.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  // 1. Save Progress
  document.getElementById('gd-btn-save').addEventListener('click', () => {
    saveFS();
    alert('Progress saved successfully!');
    popup.style.display = 'none';
  });

  // 2. Download Game Progress & Local Levels (.zip)
  document.getElementById('gd-btn-download').addEventListener('click', async () => {
    popup.style.display = 'none';
    saveFS(); 

    const zip = new JSZip();
    let added = false;

    ['CCGameManager.dat', 'CCLocalLevels.dat'].forEach(filename => {
      try {
        let data = null;
        if (Module.FS) {
          try { data = Module.FS.readFile('/Resources/' + filename); } catch(e) {}
          if (!data) { try { data = Module.FS.readFile('/' + filename); } catch(e) {} }
          if (!data) { try { data = Module.FS.readFile('/AppData/' + filename); } catch(e) {} }
        }
        if (data && data.length) {
          zip.file(filename, data);
          added = true;
        }
      } catch(e) {}
    });

    if (!added) {
      alert("No save files found currently loaded.");
      return;
    }

    const content = await zip.generateAsync({type:"blob"});
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = "geometry_dash_progress.zip";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // 3. Import CCGameManager.dat / CCLocalLevels.dat
  document.getElementById('gd-btn-import').addEventListener('click', () => {
    popup.style.display = 'none';
    document.getElementById('gd-file-input').click();
  });

  document.getElementById('gd-file-input').addEventListener('change', function(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;

    const validFiles = Array.from(files).filter(f => f.name === 'CCGameManager.dat' || f.name === 'CCLocalLevels.dat');
    if (validFiles.length === 0) {
      alert("Please select valid CCGameManager.dat or CCLocalLevels.dat files.");
      this.value = '';
      return;
    }

    let importedCount = 0;
    isRestoring = true; 
    validFiles.forEach(file => {
      const name = file.name;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const arrayBuffer = evt.target.result;
        const data = new Uint8Array(arrayBuffer);
        
        ['/Resources/' + name, '/' + name, '/AppData/' + name].forEach(p => {
          try { Module.FS.writeFile(p, data); } catch(err) {}
        });
        
        syncFilesToDB(name, data);
        importedCount++;
        if (importedCount === validFiles.length) {
          isRestoring = false;
          saveFS(); 
          alert("Successfully imported " + importedCount + " file(s)! Reloading page...");
          location.reload();
        }
      };
      reader.readAsArrayBuffer(file);
    });
    this.value = '';
  });

  // 4. Clear Data
  document.getElementById('gd-btn-clear').addEventListener('click', () => {
    popup.style.display = 'none';
    if (!confirm("Are you sure you want to clear all your saved game data and local levels?")) return;
    if (!confirm("Are you REALLY sure? This will permanently wipe your progress and cannot be undone!")) return;

    isRestoring = true;
    try {
      if (Module && Module.FS) {
        ['CCGameManager.dat', 'CCLocalLevels.dat'].forEach(file => {
          ['/Resources/' + file, '/' + file, '/AppData/' + file].forEach(p => {
            try { Module.FS.unlink(p); } catch(e) {}
          });
        });
      }
      const delReq = indexedDB.deleteDatabase('gdwasm_saves');
      delReq.onsuccess = delReq.onerror = delReq.onblocked = function() {
        alert("All save data has been cleared. The page will now reload.");
        location.reload();
      };
    } catch (e) {
      alert("All save data has been cleared. The page will now reload.");
      location.reload();
    }
  });
});

function restoreSavesBeforeBoot(callback) {
  try {
    var req = indexedDB.open('gdwasm_saves', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
    req.onerror = function() { callback(); };
    req.onsuccess = function () {
      var db = req.result;
      try {
        var tx = db.transaction('files', 'readonly');
        var store = tx.objectStore('files');
        var keysReq = store.getAllKeys();
        var valsReq = store.getAll();
        
        tx.oncomplete = function() {
          var keys = keysReq.result || [];
          var vals = valsReq.result || [];
          if (!keys.length) {
            callback();
            return;
          }
          
          for (let i = 0; i < keys.length; i++) {
            try {
              var k = keys[i];
              var res = vals[i];
              if (res && res.byteLength) {
                var s = String(k);
                var filename = s.split('/').pop();
                ['/Resources/' + filename, '/' + filename, '/AppData/' + filename].forEach(function(targetPath) {
                  try { Module.FS.writeFile(targetPath, new Uint8Array(res)); } catch(e2) {}
                });
              }
            } catch (e) {}
          }
          callback();
        };
        tx.onerror = function() { callback(); };
      } catch (e) { callback(); }
    };
  } catch (e) { callback(); }
}

let preloadedDataBuffer = null;

var Module = {
  canvas: document.getElementById('canvas'),
  gdInputQueue: [],
  gdCursorPos: [0, 0],
  webglContextAttributes: {
    alpha: false,
    depth: true,
    stencil: true,
    antialias: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: false,
    powerPreference: "high-performance"
  },
  locateFile: function (path, prefix) {
    return (prefix || '') + path;
  },
  print: function (text) {},
  printErr: function (text) {},
  setStatus: function (text) {},
  instantiateWasm: function(imports, success) {
    if (window.GDAssets && window.GDAssets.instantiateWasm) {
      return window.GDAssets.instantiateWasm(imports, success);
    }
    return {};
  },
  getPreloadedPackage: function(remotePackageName, remotePackageSize) {
    return preloadedDataBuffer;
  },
  onRuntimeInitialized: function () {
    window.__gdRuntimeReady = true;
    const overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.style.display = 'none';

    try { Module.FS.chdir('/Resources'); } catch (e) {}

    // Synchronously restore saved files into MEMFS BEFORE engine boots
    restoreSavesBeforeBoot(function () {
      if (Module.FS && Module.FS.writeFile && !Module.FS.__hooked) {
        var origWrite = Module.FS.writeFile;
        Module.FS.writeFile = function (path, data, opts) {
          var res = origWrite.apply(this, arguments);
          if (!isRestoring && path) {
            var cleanKey = path.replace(/^\/(Resources\/)?/, '');
            if (cleanKey.indexOf('CCLocalLevels') >= 0 || cleanKey.indexOf('CCGameManager') >= 0 || cleanKey.indexOf('.dat') >= 0 || cleanKey.endsWith('.mp3') || cleanKey.endsWith('.ogg')) {
              syncFilesToDB(cleanKey, data);
              syncFilesToDB('songs/' + cleanKey.split('/').pop(), data);
            }
          }
          return res;
        };
        Module.FS.__hooked = true;
      }

      try {
        const r = Module._gd_boot();
        if (r && typeof r.then === 'function') r.catch(function () {});
      } catch (e) {}
    });
  }
};

function loadScriptAsync(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load script: ' + src));
    document.body.appendChild(s);
  });
}

async function gdStartAuto() {
  window.__gdLoadStarted = true;
  window.__gdInputReady = true;
  var c = document.getElementById('canvas');
  if (c) c.focus();

  const overlay = document.getElementById('loading-overlay');

  try {
    if (overlay) overlay.innerText = 'Initializing Asset Loader...';
    
    let scriptLoaded = false;
    for (const src of [
      'payload/gd_assets.js',
      './payload/gd_assets.js',
      'gd_assets.js',
      './gd_assets.js',
      'gd2209/payload/gd_assets.js'
    ]) {
      try {
        await loadScriptAsync(src);
        scriptLoaded = true;
        break;
      } catch(e) {}
    }
    if (!scriptLoaded) throw new Error("Failed to load gd_assets.js");

    if (!window.GDAssets || !window.GDAssets.loadScript) {
      throw new Error("GDAssets is missing!");
    }

    let manifest = null;
    for (const mpath of [
      'payload/gd_assets.json?v=' + window.GD_BUILD_ID,
      './payload/gd_assets.json?v=' + window.GD_BUILD_ID,
      'gd_assets.json?v=' + window.GD_BUILD_ID,
      './gd_assets.json?v=' + window.GD_BUILD_ID
    ]) {
      try {
        const manifestResp = await fetch(mpath);
        if (manifestResp.ok) {
          manifest = await manifestResp.json();
          break;
        }
      } catch(e) {}
    }

    if (!manifest) {
      throw new Error("Asset manifest HTTP 404");
    }

    if (overlay) overlay.innerText = 'Downloading (Data) Gzip files (0%)';

    preloadedDataBuffer = await window.GDAssets.loadData('gd_web.data', manifest.data.size);

    if (overlay) overlay.innerText = 'Loading Game Script...';
    const loaderCode = await window.GDAssets.loadScript();

    if (overlay) overlay.innerText = 'Starting Engine...';
    var s = document.createElement('script');
    s.textContent = loaderCode;
    document.body.appendChild(s);

  } catch (e) {
    console.error('Failed to stream game:', e);
    const el = document.getElementById('errOverlay');
    if (el) { 
      el.textContent = 'Startup Error: ' + (e.message || e); 
      el.classList.add('on'); 
    }
    if (overlay) overlay.innerText = 'Failed to load game!';
  }
}

window.addEventListener('load', gdStartAuto);
</script>

<!-- Precise Letterbox-Aware Input Handler -->
<script>
(function () {
  const el = document.getElementById('canvas');
  const WM_MOUSEMOVE = 0x200, WM_LBUTTONDOWN = 0x201, WM_LBUTTONUP = 0x202,
        WM_RBUTTONDOWN = 0x204, WM_RBUTTONUP = 0x205,
        WM_MBUTTONDOWN = 0x207, WM_MBUTTONUP = 0x208;

  function ready() { return window.__gdInputReady === true; }

  function getScaledCanvasPos(e) {
    const r = el.getBoundingClientRect();
    const targetAspect = 1920 / 1080;
    const containerAspect = r.width / r.height;
    let renderWidth, renderHeight, offsetX, offsetY;

    if (containerAspect > targetAspect) {
      renderHeight = r.height;
      renderWidth = r.height * targetAspect;
      offsetX = r.left + (r.width - renderWidth) / 2;
      offsetY = r.top;
    } else {
      renderWidth = r.width;
      renderHeight = r.width / targetAspect;
      offsetX = r.left;
      offsetY = r.top + (r.height - renderHeight) / 2;
    }

    const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

    const x = Math.max(0, Math.min(1919, Math.round((clientX - offsetX) * 1920 / renderWidth)));
    const y = Math.max(0, Math.min(1079, Math.round((clientY - offsetY) * 1080 / renderHeight)));

    if (window.Module && window.Module.gdCursorPos) {
      window.Module.gdCursorPos[0] = x;
      window.Module.gdCursorPos[1] = y;
    }
    return (x & 0xffff) | ((y & 0xffff) << 16);
  }

  function pushInput(m, w, l) {
    if (window.Module && window.Module.gdInputQueue) {
      if (window.Module.gdInputQueue.length > 30) window.Module.gdInputQueue.shift();
      window.Module.gdInputQueue.push([m | 0, w | 0, l | 0]);
    }
  }

  window.addEventListener('click', function() {
    if (el) el.focus();
  });

  window.addEventListener('mousedown', function (e) {
    if (!ready() || e.target !== el) return;
    el.focus();
    var m = e.button === 2 ? WM_RBUTTONDOWN : (e.button === 1 ? WM_MBUTTONDOWN : WM_LBUTTONDOWN);
    var w = e.button === 2 ? 2 : (e.button === 1 ? 16 : 1);
    pushInput(m, w, getScaledCanvasPos(e));
    e.preventDefault();
  });

  window.addEventListener('mouseup', function (e) {
    if (!ready()) return;
    var m = e.button === 2 ? WM_RBUTTONUP : (e.button === 1 ? WM_MBUTTONUP : WM_LBUTTONUP);
    pushInput(m, 0, getScaledCanvasPos(e));
    pushInput(WM_MOUSEMOVE, 0, getScaledCanvasPos(e));
    if (e.target === el) e.preventDefault();
  });

  window.addEventListener('mousemove', function (e) {
    if (!ready() || !window.Module || !window.Module.gdInputQueue) return;
    var q = window.Module.gdInputQueue;
    var w = (e.buttons & 1) ? 1 : 0, l = getScaledCanvasPos(e);
    if (q.length && q[q.length - 1][0] === WM_MOUSEMOVE) q[q.length - 1] = [WM_MOUSEMOVE, w, l];
    else pushInput(WM_MOUSEMOVE, w, l);
  });

  var VK = { 'Escape':0x1B,'Space':0x20,'Enter':0x0D,'Backspace':0x08,'Tab':0x09,
  'ArrowLeft':0x25,'ArrowUp':0x26,'ArrowRight':0x27,'ArrowDown':0x28,
  'KeyW':0x57,'KeyA':0x41,'KeyS':0x53,'KeyD':0x44,
  'KeyQ':0x51,'KeyE':0x12,'KeyR':0x13,'KeyF':0x21,'KeyP':0x19 };
  var SCAN = { 'Escape':0x01,'Space':0x39,'Enter':0x1C,'Backspace':0x0E,'Tab':0x0F,
  'ArrowLeft':0x4B,'ArrowUp':0x48,'ArrowRight':0x4D,'ArrowDown':0x50,
  'KeyW':0x11,'KeyA':0x1E,'KeyS':0x1F,'KeyD':0x20,
  'KeyQ':0x10,'KeyE':0x12,'KeyR':0x13,'KeyF':0x21,'KeyP':0x19 };
  var EXT = { 'ArrowLeft':1,'ArrowUp':1,'ArrowRight':1,'ArrowDown':1 };

  if (window.Module && !window.Module.gdKeyState) {
    window.Module.gdKeyState = new Uint8Array(256);
  }

  function keyEvent(e, down) {
    if (!ready()) return;
    var vk = VK[e.code] || e.keyCode || 0;
    if (down) {
      var ch = 0;
      if (e.key && e.key.length === 1) ch = e.key.charCodeAt(0);
      else if (e.code === 'Backspace') ch = 0x08;
      else if (e.code === 'Enter') ch = 0x0D;
      if (ch) {
        var clp = 1 | ((SCAN[e.code] || 0) << 16);
        if (EXT[e.code]) clp |= 0x1000000;
        pushInput(0x0102, ch, clp);
      }
    }
    if (!vk) return;
    if (window.Module && window.Module.gdKeyState) {
      window.Module.gdKeyState[vk & 0xff] = down ? 1 : 0;
    }
    var scan = SCAN[e.code] || 0;
    var lp = 1 | (scan << 16);
    if (EXT[e.code]) lp |= 0x1000000;
    if (!down) lp |= -1073741824;
    pushInput(down ? 0x100 : 0x101, vk, lp);
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) {
      e.preventDefault();
    }
  }

  window.addEventListener('keydown', function (e) { keyEvent(e, true); });
  window.addEventListener('keyup', function (e) { keyEvent(e, false); });

  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>

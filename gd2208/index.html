<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="ref/logo.png">
<title>Geometry Dash 2.208</title>

<!-- JSZip CDN for bundled zip downloads -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  width: 100vw;
  height: 100vh;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  background: #000;
  image-rendering: pixelated;
  outline: none;
  display: block;
  user-select: none;
  touch-action: none;
}
#loading-overlay {
  position: absolute;
  color: #fff;
  font-family: monospace;
  font-size: 18px;
  background: rgba(0, 0, 0, 0.85);
  padding: 20px;
  border-radius: 8px;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}
</style>
</head>

<body>
<div id="loading-overlay">Fetching LFS Assets...</div>
<canvas id="canvas" width="1920" height="1080" tabindex="0"></canvas>

<!-- Bottom Right Menu Button & Popup -->
<div id="gd-menu-container" style="position: fixed; bottom: 15px; right: 15px; z-index: 99999; font-family: monospace;">
  <button id="gd-menu-btn" style="background: rgba(30, 30, 30, 0.85); color: #fff; border: 1px solid #555; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.5);">...</button>
  <div id="gd-menu-popup" style="display: none; position: absolute; bottom: 45px; right: 0; background: rgba(20, 20, 20, 0.95); border: 1px solid #444; border-radius: 8px; padding: 6px; width: 310px; box-shadow: 0 6px 16px rgba(0,0,0,0.6);">
    <div id="gd-btn-save" style="padding: 10px 12px; color: #fff; cursor: pointer; border-radius: 4px; font-size: 13px; transition: background 0.15s;" onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">Save Progress</div>
    <div id="gd-btn-download" style="padding: 10px 12px; color: #fff; cursor: pointer; border-radius: 4px; font-size: 13px; transition: background 0.15s;" onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">Download Game Progress & Local Levels</div>
    <div id="gd-btn-import" style="padding: 10px 12px; color: #fff; cursor: pointer; border-radius: 4px; font-size: 13px; transition: background 0.15s;" onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">Import CCGameManager.dat/CCLocalLevels.dat</div>
    <div style="height: 1px; background: #333; margin: 4px 0;"></div>
    <div id="gd-btn-clear" style="padding: 10px 12px; color: #ff6b6b; cursor: pointer; border-radius: 4px; font-size: 13px; transition: background 0.15s;" onmouseover="this.style.background='#3a1c1c'" onmouseout="this.style.background='transparent'">Clear Data</div>
  </div>
</div>
<input type="file" id="gd-file-input" multiple accept=".dat" style="display: none;">

<!-- Network Interceptor (Cloudflare Proxy for PHP, SFX, Music & Newgrounds) -->
<script>
(function() {
    const WORKER_URL = "https://gd-proxy.radekgaming67.workers.dev";

    function extractRequestType(inputUrl) {
        if (!inputUrl) return null;
        let str = String(inputUrl);
        try { str = decodeURIComponent(str); } catch(e) {}

        if (str.includes('__proxy?url=')) {
            const parts = str.split('__proxy?url=');
            if (parts[1]) {
                str = decodeURIComponent(parts[1].split('&')[0]);
            }
        }

        if (
            str.includes('geometrydashfiles.b-cdn.net') || 
            str.includes('audio.ngfiles.com') || 
            str.includes('b-cdn.net/') || 
            str.endsWith('.mp3') || 
            str.endsWith('.ogg') ||
            str.includes('songUrl=')
        ) {
            let target = str;
            if (str.includes('songUrl=')) {
                target = decodeURIComponent(str.split('songUrl=')[1].split('&')[0]);
            } else if (str.includes('?url=')) {
                target = decodeURIComponent(str.split('?url=')[1].split('&')[0]);
            }
            return { type: 'song', targetUrl: target };
        }

        const matchPhp = str.match(/([a-zA-Z0-9_-]+\.php)/i);
        if (matchPhp) {
            return { type: 'php', targetUrl: `${WORKER_URL}/?endpoint=${matchPhp[1]}` };
        }

        return null;
    }

    async function proxyFetch(targetUrl, init) {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000);
            const modifiedInit = Object.assign({}, init || {}, { signal: controller.signal });
            const res = await originalFetch(targetUrl, modifiedInit);
            clearTimeout(timeoutId);
            if (res.ok) return res;
        } catch (e) {}
        return new Response("-1", { status: 200, headers: { 'Content-Type': 'text/html' } });
    }

    const originalFetch = window.fetch;
    window.fetch = async function(resource, init) {
        let urlStr = typeof resource === 'string' ? resource : (resource ? resource.url : '');
        const reqInfo = extractRequestType(urlStr);
        if (reqInfo) {
            if (reqInfo.type === 'song') {
                return proxyFetch(`${WORKER_URL}/?songUrl=${encodeURIComponent(reqInfo.targetUrl)}`, init);
            } else if (reqInfo.type === 'php') {
                return proxyFetch(reqInfo.targetUrl, init);
            }
        }
        return originalFetch.apply(this, arguments);
    };

    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
        const reqInfo = extractRequestType(url);
        if (reqInfo) {
            if (reqInfo.type === 'song') {
                this.__gdProxyUrl = `${WORKER_URL}/?songUrl=${encodeURIComponent(reqInfo.targetUrl)}`;
            } else if (reqInfo.type === 'php') {
                this.__gdProxyUrl = reqInfo.targetUrl;
                this.__gdEndpoint = reqInfo.targetUrl.split('endpoint=')[1];
            }
            this.__gdMethod = method;
            return originalOpen.call(this, method, this.__gdProxyUrl, async, user, password);
        }
        return originalOpen.call(this, method, url, async, user, password);
    };

    const originalSend = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.send = function(body) {
        if (this.__gdEndpoint) {
            const xhr = this;
            proxyFetch(this.__gdProxyUrl, { 
                method: this.__gdMethod || 'POST', 
                body: body,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            }).then(async (res) => {
                const text = await res.text();
                setTimeout(() => {
                    try {
                        Object.defineProperty(xhr, 'responseText', { value: text, configurable: true });
                        Object.defineProperty(xhr, 'response', { value: text, configurable: true });
                        Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
                        Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
                        if (xhr.onreadystatechange) xhr.onreadystatechange();
                        if (xhr.onload) xhr.onload();
                    } catch (e) {}
                }, 10);
            });
            return;
        }
        return originalSend.call(this, body);
    };
})();
</script>

<!-- Manual Save & Menu Actions Handler -->
<script>
var isSyncing = false;
var isRestoring = false;

function syncFilesToDB(filePath, data) {
  if (isRestoring) return;
  try {
    var req = indexedDB.open('gdwasm_saves', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
    req.onsuccess = function () {
      try {
        var db = req.result;
        var tx = db.transaction('files', 'readwrite');
        var store = tx.objectStore('files');
        var buf = (data && data.buffer && data.byteLength !== undefined) ? data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength) : data;
        if (buf) store.put(buf, filePath);
      } catch (e) {}
    };
  } catch (e) {}
}

function saveFS() {
  if (!window.__gdRuntimeReady || typeof Module === 'undefined' || isSyncing || isRestoring) return;

  isSyncing = true;
  try {
    if (typeof Module._gd_request_save === 'function') {
      Module._gd_request_save();
    } else if (typeof Module._saveGame === 'function') {
      Module._saveGame();
    } else if (typeof Module.ccall === 'function') {
      try { Module.ccall('gd_request_save', null, [], []); } catch(e) {}
    }

    if (Module.FS) {
      ['CCGameManager.dat', 'CCLocalLevels.dat'].forEach(function(filename) {
        ['/' + filename, '/Resources/' + filename, '/AppData/' + filename].forEach(function(p) {
          try {
            var data = Module.FS.readFile(p);
            if (data && data.length) {
              syncFilesToDB(filename, data);
            }
          } catch(e) {}
        });
      });

      if (Module.FS.syncfs) {
        Module.FS.syncfs(false, function (err) { isSyncing = false; });
      } else {
        isSyncing = false;
      }
    } else {
      isSyncing = false;
    }
  } catch (e) {
    isSyncing = false;
  }
}

// Menu UI interaction & manual triggers
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('gd-menu-btn');
  const popup = document.getElementById('gd-menu-popup');
  
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    popup.style.display = popup.style.display === 'block' ? 'none' : 'block';
  });

  document.addEventListener('click', () => {
    popup.style.display = 'none';
  });

  popup.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  // 1. Save Progress
  document.getElementById('gd-btn-save').addEventListener('click', () => {
    saveFS();
    alert('Progress saved successfully!');
    popup.style.display = 'none';
  });

  // 2. Download Game Progress & Local Levels (.zip)
  document.getElementById('gd-btn-download').addEventListener('click', async () => {
    popup.style.display = 'none';
    saveFS(); 

    const zip = new JSZip();
    let added = false;

    ['CCGameManager.dat', 'CCLocalLevels.dat'].forEach(filename => {
      try {
        let data = null;
        if (Module.FS) {
          try { data = Module.FS.readFile('/' + filename); } catch(e) {}
          if (!data) { try { data = Module.FS.readFile('/Resources/' + filename); } catch(e) {} }
          if (!data) { try { data = Module.FS.readFile('/AppData/' + filename); } catch(e) {} }
        }
        if (data && data.length) {
          zip.file(filename, data);
          added = true;
        }
      } catch(e) {}
    });

    if (!added) {
      alert("No save files found currently loaded.");
      return;
    }

    const content = await zip.generateAsync({type:"blob"});
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = "geometry_dash_progress.zip";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // 3. Import CCGameManager.dat / CCLocalLevels.dat
  document.getElementById('gd-btn-import').addEventListener('click', () => {
    popup.style.display = 'none';
    document.getElementById('gd-file-input').click();
  });

  document.getElementById('gd-file-input').addEventListener('change', function(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;

    const validFiles = Array.from(files).filter(f => f.name === 'CCGameManager.dat' || f.name === 'CCLocalLevels.dat');
    if (validFiles.length === 0) {
      alert("Please select valid CCGameManager.dat or CCLocalLevels.dat files.");
      this.value = '';
      return;
    }

    let importedCount = 0;
    isRestoring = true; 
    validFiles.forEach(file => {
      const name = file.name;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const arrayBuffer = evt.target.result;
        const data = new Uint8Array(arrayBuffer);
        
        ['/' + name, '/Resources/' + name, '/AppData/' + name].forEach(p => {
          try { Module.FS.writeFile(p, data); } catch(err) {}
        });
        
        syncFilesToDB(name, data);
        importedCount++;
        if (importedCount === validFiles.length) {
          isRestoring = false;
          saveFS(); 
          alert("Successfully imported " + importedCount + " file(s)! Reloading page...");
          location.reload();
        }
      };
      reader.readAsArrayBuffer(file);
    });
    this.value = '';
  });

  // 4. Clear Data
  document.getElementById('gd-btn-clear').addEventListener('click', () => {
    popup.style.display = 'none';
    if (!confirm("Are you sure you want to clear all your saved game data and local levels?")) return;
    if (!confirm("Are you REALLY sure? This will permanently wipe your progress and cannot be undone!")) return;

    isRestoring = true;
    try {
      if (Module && Module.FS) {
        ['CCGameManager.dat', 'CCLocalLevels.dat'].forEach(file => {
          ['/' + file, '/Resources/' + file, '/AppData/' + file].forEach(p => {
            try { Module.FS.unlink(p); } catch(e) {}
          });
        });
      }
      const delReq = indexedDB.deleteDatabase('gdwasm_saves');
      delReq.onsuccess = delReq.onerror = delReq.onblocked = function() {
        alert("All save data has been cleared. The page will now reload.");
        location.reload();
      };
    } catch (e) {
      alert("All save data has been cleared. The page will now reload.");
      location.reload();
    }
  });
});

function restoreSavesBeforeBoot(callback) {
  try {
    var req = indexedDB.open('gdwasm_saves', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
    req.onerror = function() { callback(); };
    req.onsuccess = function () {
      var db = req.result;
      try {
        var tx = db.transaction('files', 'readonly');
        var store = tx.objectStore('files');
        var keysReq = store.getAllKeys();
        var valsReq = store.getAll();
        
        tx.oncomplete = function() {
          var keys = keysReq.result || [];
          var vals = valsReq.result || [];
          if (!keys.length) {
            callback();
            return;
          }
          
          for (let i = 0; i < keys.length; i++) {
            try {
              var k = keys[i];
              var res = vals[i];
              if (res && res.byteLength) {
                var s = String(k);
                var filename = s.split('/').pop();
                ['/' + filename, '/Resources/' + filename, '/AppData/' + filename].forEach(function(targetPath) {
                  try { Module.FS.writeFile(targetPath, new Uint8Array(res)); } catch(e2) {}
                });
              }
            } catch (e) {}
          }
          callback();
        };
        tx.onerror = function() { callback(); };
      } catch (e) { callback(); }
    };
  } catch (e) { callback(); }
}

var gdDataBlobUrl = null;

async function fetchLfsDataFile() {
  const overlay = document.getElementById('loading-overlay');
  const lfsUrl = 'gd_web.data';
  
  if (overlay) overlay.innerText = 'Downloading 314 MB Game Data...';
  
  const resp = await fetch(lfsUrl);
  if (!resp.ok) {
    console.warn('LFS media endpoint fetch failed, trying local fallback.');
    return 'gd_web.data';
  }
  
  const blob = await resp.blob();
  gdDataBlobUrl = URL.createObjectURL(blob);
  return gdDataBlobUrl;
}

var Module = {
  canvas: (function() {
    var c = document.getElementById('canvas');
    return c;
  })(),
  gdInputQueue: [],
  gdCursorPos: [0, 0],
  webglContextAttributes: {
    alpha: false,
    depth: true,
    stencil: true,
    antialias: false,
    premultipliedAlpha: false,
    preserveDrawingBuffer: false,
    powerPreference: "high-performance"
  },
  locateFile: function (path, prefix) {
    if (path === 'gd_web.data' || path.endsWith('.data')) {
      return gdDataBlobUrl || 'gd_web.data';
    }
    return (prefix || '') + path;
  },
  print: function (text) {},
  printErr: function (text) {},
  setStatus: function (text) {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      if (!text) {
        overlay.style.display = 'none';
      } else {
        overlay.innerText = text;
      }
    }
  },
  onRuntimeInitialized: function () {
    window.__gdRuntimeReady = true;
    const overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.style.display = 'none';

    if (Module._gd_autosave_set) Module._gd_autosave_set(1);

    try { Module.FS.chdir('/Resources'); } catch (e) {}

    // Synchronously restore saved files into MEMFS BEFORE engine boots
    restoreSavesBeforeBoot(function () {
      if (Module.FS && Module.FS.writeFile && !Module.FS.__hooked) {
        var origWrite = Module.FS.writeFile;
        Module.FS.writeFile = function (path, data, opts) {
          var res = origWrite.apply(this, arguments);
          if (!isRestoring && path && (path.indexOf('CCLocalLevels') >= 0 || path.indexOf('CCGameManager') >= 0 || path.indexOf('.dat') >= 0)) {
            var cleanKey = path.replace(/^\/(Resources\/)?/, '');
            syncFilesToDB(cleanKey, data);
          }
          return res;
        };
        Module.FS.__hooked = true;
      }

      try {
        const r = Module._gd_boot();
        if (r && typeof r.then === 'function') r.catch(function () {});
      } catch (e) {}
    });
  }
};

async function gdStart() {
  window.__gdLoadStarted = true;
  window.__gdInputReady = true;
  var c = document.getElementById('canvas');
  if (c) c.focus();
  
  try {
    await fetchLfsDataFile();
  } catch (err) {
    console.error('Failed to load LFS data file:', err);
  }

  fetch('gd_web.js', { cache: 'no-store' }).then(function (r) {
    return r.text();
  }).then(function (code) {
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  });
}

window.addEventListener('DOMContentLoaded', gdStart);
</script>

<script>
(function () {
  const el = document.getElementById('canvas');
  const WM_MOUSEMOVE = 0x200, WM_LBUTTONDOWN = 0x201, WM_LBUTTONUP = 0x202,
        WM_RBUTTONDOWN = 0x204, WM_RBUTTONUP = 0x205,
        WM_MBUTTONDOWN = 0x207, WM_MBUTTONUP = 0x208;

  function ready() { return window.__gdInputReady === true; }

  function pos(e) {
    const r = el.getBoundingClientRect();
    const targetAspect = 1920 / 1080;
    const containerAspect = r.width / r.height;
    let renderWidth, renderHeight, offsetX, offsetY;

    if (containerAspect > targetAspect) {
      renderHeight = r.height;
      renderWidth = r.height * targetAspect;
      offsetX = r.left + (r.width - renderWidth) / 2;
      offsetY = r.top;
    } else {
      renderWidth = r.width;
      renderHeight = r.width / targetAspect;
      offsetX = r.left;
      offsetY = r.top + (r.height - renderHeight) / 2;
    }

    const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

    const x = Math.max(0, Math.min(1919, Math.round((clientX - offsetX) * 1920 / renderWidth)));
    const y = Math.max(0, Math.min(1079, Math.round((clientY - offsetY) * 1080 / renderHeight)));

    Module.gdCursorPos[0] = x;
    Module.gdCursorPos[1] = y;
    return (x & 0xffff) | ((y & 0xffff) << 16);
  }

  function push(m, w, l) {
    if (Module.gdInputQueue.length > 30) Module.gdInputQueue.shift();
    Module.gdInputQueue.push([m | 0, w | 0, l | 0]);
  }

  window.addEventListener('click', function() {
    if (el) el.focus();
  });

  window.addEventListener('mousedown', function (e) {
    if (!ready() || e.target !== el) return;
    el.focus();
    var m = e.button === 2 ? WM_RBUTTONDOWN : (e.button === 1 ? WM_MBUTTONDOWN : WM_LBUTTONDOWN);
    var w = e.button === 2 ? 2 : (e.button === 1 ? 16 : 1);
    push(m, w, pos(e));
    e.preventDefault();
  });

  window.addEventListener('mouseup', function (e) {
    if (!ready()) return;
    var m = e.button === 2 ? WM_RBUTTONUP : (e.button === 1 ? WM_MBUTTONUP : WM_LBUTTONUP);
    push(m, 0, pos(e));
    push(WM_MOUSEMOVE, 0, pos(e));
    if (e.target === el) e.preventDefault();
  });

  window.addEventListener('mousemove', function (e) {
    if (!ready()) return;
    var q = Module.gdInputQueue;
    var w = (e.buttons & 1) ? 1 : 0, l = pos(e);
    if (q.length && q[q.length - 1][0] === WM_MOUSEMOVE) q[q.length - 1] = [WM_MOUSEMOVE, w, l];
    else push(WM_MOUSEMOVE, w, l);
  });

  var VK = { 'Escape':0x1B,'Space':0x20,'Enter':0x0D,'Backspace':0x08,'Tab':0x09,
  'ArrowLeft':0x25,'ArrowUp':0x26,'ArrowRight':0x27,'ArrowDown':0x28,
  'KeyW':0x57,'KeyA':0x41,'KeyS':0x53,'KeyD':0x44,
  'KeyQ':0x51,'KeyE':0x12,'KeyR':0x13,'KeyF':0x21,'KeyP':0x19 };
  var SCAN = { 'Escape':0x01,'Space':0x39,'Enter':0x1C,'Backspace':0x0E,'Tab':0x0F,
  'ArrowLeft':0x4B,'ArrowUp':0x48,'ArrowRight':0x4D,'ArrowDown':0x50,
  'KeyW':0x11,'KeyA':0x1E,'KeyS':0x1F,'KeyD':0x20,
  'KeyQ':0x10,'KeyE':0x12,'KeyR':0x13,'KeyF':0x21,'KeyP':0x19 };
  var EXT = { 'ArrowLeft':1,'ArrowUp':1,'ArrowRight':1,'ArrowDown':1 };
  Module.gdKeyState = new Uint8Array(256);

  function keyEvent(e, down) {
    if (!ready()) return;
    var vk = VK[e.code] || e.keyCode || 0;
    if (down) {
      var ch = 0;
      if (e.key && e.key.length === 1) ch = e.key.charCodeAt(0);
      else if (e.code === 'Backspace') ch = 0x08;
      else if (e.code === 'Enter') ch = 0x0D;
      if (ch) {
        var clp = 1 | ((SCAN[e.code] || 0) << 16);
        if (EXT[e.code]) clp |= 0x1000000;
        push(0x0102, ch, clp);
      }
    }
    if (!vk) return;
    Module.gdKeyState[vk & 0xff] = down ? 1 : 0;
    var scan = SCAN[e.code] || 0;
    var lp = 1 | (scan << 16);
    if (EXT[e.code]) lp |= 0x1000000;
    if (!down) lp |= -1073741824;
    push(down ? 0x100 : 0x101, vk, lp);
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) {
      e.preventDefault();
    }
  }

  window.addEventListener('keydown', function (e) { keyEvent(e, true); });
  window.addEventListener('keyup', function (e) { keyEvent(e, false); });

  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
